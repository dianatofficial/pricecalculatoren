<main class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-50 to-sky-100 dark:from-slate-900 dark:to-slate-950">
  <div class="w-full max-w-6xl mx-auto">
    <div class="bg-white/70 dark:bg-slate-800/70 backdrop-blur-xl p-6 sm:p-8 rounded-3xl shadow-2xl shadow-sky-100/50 dark:shadow-slate-950/50 border border-slate-200 dark:border-slate-700 relative">
      
      <!-- Top Bar with Language Switcher -->
      <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-sky-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 7h6m0 10v-3m-3 3h3m-3-10h.01M9 10h.01M12 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <div [class.text-left]="langService.isEn()" [class.text-right]="langService.isFa()">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 dark:text-white">
              {{ langService.t().appTitle }}
            </h1>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">
              {{ langService.t().developerInfo }}
            </p>
          </div>
        </div>

        <!-- Language Switcher Toggle Button -->
        <div class="inline-flex items-center p-1 bg-slate-200/80 dark:bg-slate-700/80 rounded-xl border border-slate-300/50 dark:border-slate-600/50 shadow-inner">
          <button (click)="langService.setLanguage('en')" 
                  type="button"
                  [class]="'px-3 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 flex items-center gap-1.5 ' + (langService.isEn() ? 'bg-sky-500 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white')">
            <span>🇺🇸</span>
            <span>EN</span>
          </button>
          <button (click)="langService.setLanguage('fa')" 
                  type="button"
                  [class]="'px-3 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 flex items-center gap-1.5 ' + (langService.isFa() ? 'bg-sky-500 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white')">
            <span>🇮🇷</span>
            <span>FA</span>
          </button>
        </div>
      </div>

      <!-- Tab Navigation -->
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2 rounded-lg bg-slate-100 dark:bg-slate-700/50 p-1.5 mb-8">
        <button (click)="setCalculationMode('thesis')" [class]="'w-full py-2.5 px-3 rounded-md text-xs sm:text-sm font-bold transition-all duration-300 outline-none focus:ring-2 focus:ring-sky-500 flex items-center justify-center gap-1.5 ' + (calculationMode() === 'thesis' ? 'bg-sky-500 text-white shadow-md shadow-sky-500/20' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-600/50')">
           <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" viewBox="0 0 20 20" fill="currentColor"><path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 011.087.025l1.006.84a1 1 0 001.316 0l1.006-.839a.999.999 0 011.087-.025l2.861 1.32a1 1 0 000-1.84l-7-3zM3 9.366V16a1 1 0 001 1h12a1 1 0 001-1V9.366l-2.131.926a.999.999 0 01-1.087-.025l-1.006-.84a1 1 0 00-1.316 0l-1.006.84a.999.999 0 01-1.087.025L3 9.366z" /></svg>
          <span class="truncate">{{ langService.t().tabThesis }}</span>
        </button>
        <button (click)="setCalculationMode('proposal')" [class]="'w-full py-2.5 px-3 rounded-md text-xs sm:text-sm font-bold transition-all duration-300 outline-none focus:ring-2 focus:ring-sky-500 flex items-center justify-center gap-1.5 ' + (calculationMode() === 'proposal' ? 'bg-sky-500 text-white shadow-md shadow-sky-500/20' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-600/50')">
           <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
          </svg>
          <span class="truncate">{{ langService.t().tabProposal }}</span>
        </button>
        <button (click)="setCalculationMode('article')" [class]="'w-full py-2.5 px-3 rounded-md text-xs sm:text-sm font-bold transition-all duration-300 outline-none focus:ring-2 focus:ring-sky-500 flex items-center justify-center gap-1.5 ' + (calculationMode() === 'article' ? 'bg-sky-500 text-white shadow-md shadow-sky-500/20' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-600/50')">
           <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" viewBox="0 0 20 20" fill="currentColor"><path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 16c1.255 0 2.443-.29 3.5-.804V4.804zM14.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 0114.5 16c1.255 0 2.443-.29 3.5-.804v-10A7.968 7.968 0 0014.5 4z" /></svg>
          <span class="truncate">{{ langService.t().tabArticle }}</span>
        </button>
        <button (click)="setCalculationMode('thesis-to-article')" [class]="'w-full py-2.5 px-3 rounded-md text-xs sm:text-sm font-bold transition-all duration-300 outline-none focus:ring-2 focus:ring-sky-500 flex items-center justify-center gap-1.5 ' + (calculationMode() === 'thesis-to-article' ? 'bg-sky-500 text-white shadow-md shadow-sky-500/20' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-600/50')">
           <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
          <span class="truncate">{{ langService.t().tabThesisToArticle }}</span>
        </button>
        <button (click)="setCalculationMode('action-research')" [class]="'w-full py-2.5 px-3 rounded-md text-xs sm:text-sm font-bold transition-all duration-300 outline-none focus:ring-2 focus:ring-sky-500 flex items-center justify-center gap-1.5 ' + (calculationMode() === 'action-research' ? 'bg-sky-500 text-white shadow-md shadow-sky-500/20' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-600/50')">
           <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"></path></svg>
          <span class="truncate">{{ langService.t().tabActionResearch }}</span>
        </button>
        <button (click)="setCalculationMode('article-summary')" [class]="'w-full py-2.5 px-3 rounded-md text-xs sm:text-sm font-bold transition-all duration-300 outline-none focus:ring-2 focus:ring-sky-500 flex items-center justify-center gap-1.5 ' + (calculationMode() === 'article-summary' ? 'bg-sky-500 text-white shadow-md shadow-sky-500/20' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-600/50')">
           <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 1h8a1 1 0 011 1v2a1 1 0 01-1 1H6a1 1 0 01-1-1V6a1 1 0 011-1zm1 5a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"></path></svg>
          <span class="truncate">{{ langService.t().tabArticleSummary }}</span>
        </button>
      </div>

      <!-- Main Content Area -->
      <div class="min-h-[550px]">
        @switch (calculationMode()) {
          @case ('thesis') { <app-project-calculator /> }
          @case ('proposal') { <app-proposal-calculator /> }
          @case ('article') { <app-article-calculator /> }
          @case ('thesis-to-article') { <app-thesis-to-article-calculator /> }
          @case ('action-research') { <app-action-research-calculator /> }
          @case ('article-summary') { <app-article-summary-calculator /> }
        }
      </div>
    </div>
    <footer class="text-center mt-6 text-sm text-slate-500/80 dark:text-slate-400/80">
      {{ langService.t().footerRights }}
    </footer>
  </div>
</main>

<style>
  .animate-fade-in {
    animation: fadeIn 0.5s ease-in-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
